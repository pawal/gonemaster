services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gonemaster
      POSTGRES_PASSWORD: gonemaster
      POSTGRES_DB: gonemaster_test

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: gonemaster
      MARIADB_PASSWORD: gonemaster
      MARIADB_DATABASE: gonemaster_test
      MARIADB_ROOT_PASSWORD: root

steps:
  ui_checks:
    image: node:22-bookworm
    commands:
      - npm --prefix ui ci
      - npm --prefix ui run test
      - npm --prefix ui run build

  spec_check:
    image: golang:1.27
    commands:
      - go run ./tools/specifications/validate
      - go run ./tools/specifications/generate-tag-catalog --check
      - go run ./tools/specifications/export-log-args --check-coherency --markdown-out '' >/dev/null
      - go run ./tools/i18n/check-placeholders

  architecture_check:
    image: golang:1.27
    commands:
      - go run ./tools/architecture-check

  gofmt_check:
    image: golang:1.27
    commands:
      - |
        set -eu
        unformatted=$(gofmt -l $(git ls-files '*.go'))
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-clean:"
          echo "$unformatted"
          exit 1
        fi

  go_test:
    image: golang:1.27
    depends_on:
      - ui_checks
    commands:
      - go test ./...

  # -race requires cgo, so this step must stay on the Debian-based golang
  # image and must never inherit CGO_ENABLED=0.
  race_test:
    image: golang:1.27
    commands:
      - make race-ci

  integration_test:
    image: golang:1.27
    depends_on:
      - go_test
    environment:
      TEST_POSTGRES_DSN: postgres://gonemaster:gonemaster@postgres/gonemaster_test?sslmode=disable
      TEST_MARIADB_DSN: gonemaster:gonemaster@tcp(mariadb:3306)/gonemaster_test
    commands:
      - bash -c 'i=0; until echo > /dev/tcp/postgres/5432 2>/dev/null || [ $i -ge 30 ]; do i=$((i+1)); sleep 1; done'
      - bash -c 'i=0; until echo > /dev/tcp/mariadb/3306 2>/dev/null || [ $i -ge 30 ]; do i=$((i+1)); sleep 1; done'
      # Keep the timeout in step with the test-integration target in the
      # Makefile: this runs the same tests, against services CI already
      # provides rather than ones the target starts itself.
      - go test ./server/... -count=1 -timeout 600s

  build_server_with_ui:
    image: golang:1.27
    depends_on:
      - ui_checks
    commands:
      - go build -trimpath -o /tmp/gonemaster-server ./cmd/gonemaster-server

  deploy_pages:
    image: alpine:3.21
    depends_on:
      - integration_test
      - build_server_with_ui
      - spec_check
      - race_test
    environment:
      CODEBERG_PAGES_TOKEN:
        from_secret: CODEBERG_PAGES_TOKEN
    commands:
      - apk add --no-cache git make hugo
      - make docs
      - cd site/public
      - git init -b pages
      - git config user.name "Woodpecker CI"
      - git config user.email "noreply@codeberg.org"
      - git add -A
      - git commit -m "deploy"
      - test -n "$CODEBERG_PAGES_TOKEN" || { echo "secret not injected"; exit 1; }
      - git push --force "https://pawal:$CODEBERG_PAGES_TOKEN@codeberg.org/pawal/gonemaster.git" HEAD:pages
    when:
      event: push
      branch: main
when:
  event:
    - push
    - pull_request

---
steps:
  ui_build:
    image: node:22-bookworm
    commands:
      - npm --prefix ui ci
      - npm --prefix ui run build

  build_artifacts:
    image: golang:1.27
    depends_on:
      - ui_build
    commands:
      - |
        set -eu
        mkdir -p dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          goos=${target%/*}
          goarch=${target#*/}
          for bin in gonemaster gonemaster-server gonemaster-client gonemaster-nagios; do
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -o "dist/${bin}_${CI_COMMIT_TAG}_${goos}_${goarch}${ext}" "./cmd/${bin}"
          done
        done
        (cd dist && sha256sum * > checksums.txt)

  publish_release:
    image: woodpeckerci/plugin-release
    depends_on:
      - build_artifacts
    settings:
      base_url: https://codeberg.org
      api_key:
        from_secret: CODEBERG_RELEASE_TOKEN
      title: gonemaster ${CI_COMMIT_TAG}
      files:
        - dist/*

when:
  event:
    - tag
  ref:
    include:
      - refs/tags/v*

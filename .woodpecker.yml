steps:
  test:
    image: golang:1.24-bookworm
    environment:
      GOMAXPROCS: 4
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends nodejs npm
      - make test
when:
  event:
    - push
    - pull_request

---
steps:
  build_artifacts:
    image: golang:1.24-bookworm
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends nodejs npm
      - make ui-build
      - |
        set -eu
        mkdir -p dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          goos=${target%/*}
          goarch=${target#*/}
          for bin in gonemaster gonemaster-server gonemaster-client gonemaster-nagios; do
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -o "dist/${bin}_${CI_COMMIT_TAG}_${goos}_${goarch}${ext}" "./cmd/${bin}"
          done
        done
        (cd dist && sha256sum * > checksums.txt)

  publish_release:
    image: woodpeckerci/plugin-release
    depends_on:
      - build_artifacts
    settings:
      base_url: https://codeberg.org
      api_key:
        from_secret: CODEBERG_RELEASE_TOKEN
      title: gonemaster ${CI_COMMIT_TAG}
      files:
        - dist/*

when:
  event:
    - tag
  ref:
    include:
      - refs/tags/v*

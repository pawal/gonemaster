steps:
  ui_checks:
    image: node:22-bookworm
    commands:
      - npm --prefix ui ci
      - npm --prefix ui run test
      - npm --prefix ui run build

  spec_check:
    image: golang:1.25
    commands:
      - go run ./tools/specifications/validate
      - go run ./tools/specifications/generate-tag-catalog --check
      - go run ./tools/specifications/export-log-args --check-coherency --markdown-out '' >/dev/null
      - go run ./tools/i18n/check-placeholders

  go_test:
    image: golang:1.25
    depends_on:
      - ui_checks
    environment:
      GOMAXPROCS: 4
    commands:
      - go test -p 4 -parallel 4 ./...

  build_server_with_ui:
    image: golang:1.25
    depends_on:
      - ui_checks
    commands:
      - go build -trimpath -o /tmp/gonemaster-server ./cmd/gonemaster-server
when:
  event:
    - push
    - pull_request

---
steps:
  ui_build:
    image: node:22-bookworm
    commands:
      - npm --prefix ui ci
      - npm --prefix ui run build

  build_artifacts:
    image: golang:1.25
    depends_on:
      - ui_build
    commands:
      - |
        set -eu
        mkdir -p dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          goos=${target%/*}
          goarch=${target#*/}
          for bin in gonemaster gonemaster-server gonemaster-client gonemaster-nagios; do
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -o "dist/${bin}_${CI_COMMIT_TAG}_${goos}_${goarch}${ext}" "./cmd/${bin}"
          done
        done
        (cd dist && sha256sum * > checksums.txt)

  publish_release:
    image: woodpeckerci/plugin-release
    depends_on:
      - build_artifacts
    settings:
      base_url: https://codeberg.org
      api_key:
        from_secret: CODEBERG_RELEASE_TOKEN
      title: gonemaster ${CI_COMMIT_TAG}
      files:
        - dist/*

when:
  event:
    - tag
  ref:
    include:
      - refs/tags/v*

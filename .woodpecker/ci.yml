# Share the Go caches across steps via the workspace volume.
variables:
  - &go_cache export GOCACHE="$CI_WORKSPACE/.gocache" GOMODCACHE="$CI_WORKSPACE/.gomodcache"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gonemaster
      POSTGRES_PASSWORD: gonemaster
      POSTGRES_DB: gonemaster_test

  # Pinned to the same 11.8 LTS series as docker-compose.test.yml, so CI and a
  # local run agree on innodb_snapshot_isolation (the default from 11.6.2 on,
  # which turns concurrent writes to one row into ER_CHECKREAD).
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_USER: gonemaster
      MARIADB_PASSWORD: gonemaster
      MARIADB_DATABASE: gonemaster_test
      MARIADB_ROOT_PASSWORD: root

steps:
  # All three build into server/*/dist; a missing one skips its Go tests.
  ui_checks:
    image: node:24-trixie
    commands:
      - npm --prefix ui ci
      - npm --prefix ui-public ci
      - npm --prefix analysis-ui ci
      - npm --prefix ui run test
      - npm --prefix ui-public run test
      - npm --prefix analysis-ui run test
      - npm --prefix ui run build
      - npm --prefix ui-public run build
      - npm --prefix analysis-ui run build
      - make spec-check-node

  # spec-check-go builds ./server (via export-testcase-descriptions), so this
  # step has the same ui_checks dependency as race_test below.
  static_checks:
    image: golang:1.27
    depends_on:
      - ui_checks
    commands:
      - *go_cache
      - make fmt-check
      - make architecture-check
      - make spec-check-go

  go_test:
    image: golang:1.27
    depends_on:
      - ui_checks
    commands:
      - *go_cache
      - go test ./...

  # -race requires cgo, so this step must stay on the Debian-based golang
  # image and must never inherit CGO_ENABLED=0. It also waits for ui_checks
  # because the vite builds empty server/*/dist, which ./server embeds.
  race_test:
    image: golang:1.27
    depends_on:
      - ui_checks
    commands:
      - *go_cache
      - make race-ci

  integration_test:
    image: golang:1.27
    depends_on:
      - go_test
    environment:
      TEST_POSTGRES_DSN: postgres://gonemaster:gonemaster@postgres/gonemaster_test?sslmode=disable
      TEST_MARIADB_DSN: gonemaster:gonemaster@tcp(mariadb:3306)/gonemaster_test
    commands:
      - *go_cache
      - bash -c 'i=0; until echo > /dev/tcp/postgres/5432 2>/dev/null || [ $i -ge 30 ]; do i=$((i+1)); sleep 1; done'
      - bash -c 'i=0; until echo > /dev/tcp/mariadb/3306 2>/dev/null || [ $i -ge 30 ]; do i=$((i+1)); sleep 1; done'
      # Keep the timeout in step with the Makefile's test-integration target.
      - go test ./server/... -count=1 -timeout 600s

  build_server_with_ui:
    image: golang:1.27
    depends_on:
      - ui_checks
    commands:
      - *go_cache
      - go build -trimpath -o /tmp/gonemaster-server ./cmd/gonemaster-server

  deploy_pages:
    image: alpine:3.21
    depends_on:
      - integration_test
      - build_server_with_ui
      - static_checks
      - race_test
    environment:
      CODEBERG_PAGES_TOKEN:
        from_secret: CODEBERG_PAGES_TOKEN
    commands:
      - apk add --no-cache git make hugo
      - make docs
      - cd site/public
      - git init -b pages
      - git config user.name "Woodpecker CI"
      - git config user.email "noreply@codeberg.org"
      - git add -A
      - git commit -m "deploy"
      - test -n "$CODEBERG_PAGES_TOKEN" || { echo "secret not injected"; exit 1; }
      - git push --force "https://pawal:$CODEBERG_PAGES_TOKEN@codeberg.org/pawal/gonemaster.git" HEAD:pages
    when:
      event: push
      branch: main
when:
  event:
    - push
    - pull_request

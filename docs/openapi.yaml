components:
  parameters:
    IDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PublicIDPath:
      name: public_id
      in: path
      required: true
      schema:
        type: string
    DatasetTagPath:
      name: dataset_tag
      in: path
      required: true
      schema:
        type: string
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
    DomainPath:
      name: domain
      in: path
      required: true
      schema:
        type: string
    NamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
    AddressPath:
      name: address
      in: path
      required: true
      schema:
        type: string
    ASNPath:
      name: asn
      in: path
      required: true
      schema:
        type: integer
    TagPath:
      name: tag
      in: path
      required: true
      schema:
        type: string

  schemas:
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled, expired, paused]

    Job:
      type: object
      required: [id, domain, status, created_at]
      properties:
        id:
          type: string
        batch_id:
          type: string
          description: Optional unique identifier for batch runs.
        domain:
          type: string
        severity_totals:
          type: object
          additionalProperties:
            type: integer
        status:

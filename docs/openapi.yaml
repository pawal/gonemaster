openapi: 3.0.3
info:
  title: Gonemaster API
  version: 0.1.0
  description: |
    REST API for running Gonemaster engine tests with queueing, streaming, and cancellation.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development (API base)

tags:
  - name: Jobs
  - name: Batches
  - name: Queue
  - name: Ops

paths:
  /jobs:
    post:
      tags: [Jobs]
      summary: Submit a single test job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [Jobs]
      summary: List jobs
      operationId: listJobs
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: batch_id
          in: query
          schema:
            type: string
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: domain
          in: query
          schema:
            type: string
        - name: severity
          in: query
          description: Filter by aggregated severity totals before pagination.
          schema:
            type: string
            enum: [warnings_plus, errors_only]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/batch:
    post:
      tags: [Jobs]
      summary: Submit a batch of test jobs
      description: Undelegated input (`nameservers`, `ds_info`) is not supported for batch submission.
      operationId: createJobBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobBatchRequest'
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobBatchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /batches/{batch_id}:
    get:
      tags: [Batches]
      summary: Get batch summary
      operationId: getBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Get job status
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/result:
    get:
      tags: [Jobs]
      summary: Get job result
      operationId: getJobResult
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          description: Locale for translated messages (default en)
          schema:
            type: string
      responses:
        '200':
          description: Job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/events:
    get:
      tags: [Jobs]
      summary: Stream job events (SSE)
      operationId: streamJobEvents
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a running or queued job
      operationId: cancelJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /queue/pause:
    post:
      tags: [Queue]
      summary: Pause queue processing
      operationId: pauseQueue
      responses:
        '200':
          description: Queue paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: paused

  /queue/resume:
    post:
      tags: [Queue]
      summary: Resume queue processing
      operationId: resumeQueue
      responses:
        '200':
          description: Queue resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: resumed

  /queue/reorder:
    post:
      tags: [Queue]
      summary: Reorder queued jobs
      operationId: reorderQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueReorderRequest'
      responses:
        '200':
          description: Queue reordered
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /queue/remove:
    post:
      tags: [Queue]
      summary: Remove queued jobs
      operationId: removeQueueJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRemoveRequest'
      responses:
        '200':
          description: Jobs removed from queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueRemoveResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /metrics:
    get:
      tags: [Ops]
      summary: Metrics snapshot
      operationId: metrics
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [1h, 6h, 24h, 48h]
          description: Optional trend window selection for `trends.windows`.
        - in: query
          name: include
          required: false
          schema:
            type: string
          description: Comma-separated sections to include (`all`, `health`, `jobs`, `api`, `quality`, `insights`, `trends`).
        - in: query
          name: limit_domains
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of domain insight rows in the response.
        - in: query
          name: limit_batches
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of batch insight rows in the response.
      responses:
        '200':
          description: Metrics JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /locales:
    get:
      tags: [Ops]
      summary: List available translation locales
      operationId: listLocales
      description: >
        Returns the list of locale codes for which translated result messages
        are available. The list always includes `en` (English). Pass one of
        these codes as the `locale` query parameter on `GET /jobs/{id}/result`
        to receive translated messages.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [locales]
                properties:
                  locales:
                    type: array
                    items:
                      type: string
                    example: [da, en, es, fi, fr, nb, sl, sv]

  /healthz:
    get:
      tags: [Ops]
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled, expired, paused]

    Job:
      type: object
      required: [id, domain, status, created_at]
      properties:
        id:
          type: string
        batch_id:
          type: string
          description: Optional unique identifier for batch runs.
        domain:
          type: string
        severity_totals:
          type: object
          additionalProperties:
            type: integer
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Progress percentage (0-100).
        result_url:
          type: string
        error:
          type: string

    JobCreateRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        tests:
          type: array
          items:
            type: string
        profile_overrides:
          type: object
          additionalProperties: true
        nameservers:
          type: array
          description: Optional undelegated nameserver/glue input for single-job pre-delegation testing.
          items:
            $ref: '#/components/schemas/UndelegatedNameserverInput'
        ds_info:
          type: array
          description: Optional undelegated DS input for single-job pre-delegation testing (DS-only mode allowed).
          items:
            $ref: '#/components/schemas/UndelegatedDSInput'
        min_level:
          type: string

    JobBatchRequest:
      type: object
      required: [domains]
      description: Batch submission accepts only domain/test/profile/min-level fields; undelegated input is rejected.
      properties:
        domains:
          type: array
          items:
            type: string
        tests:
          type: array
          items:
            type: string
        profile_overrides:
          type: object
          additionalProperties: true
        min_level:
          type: string

    UndelegatedNameserverInput:
      type: object
      required: [ns]
      properties:
        ns:
          type: string
          description: Nameserver hostname (normalized/canonicalized server-side).
        ip:
          type: string
          description: Optional IPv4 or IPv6 address for this nameserver row.

    UndelegatedDSInput:
      type: object
      required: [keytag, algorithm, digtype, digest]
      properties:
        keytag:
          type: integer
          minimum: 0
          maximum: 65535
        algorithm:
          type: integer
          minimum: 0
          maximum: 255
        digtype:
          type: integer
          minimum: 0
          maximum: 255
        digest:
          type: string
          description: Hex-encoded DS digest.

    JobBatchResponse:
      type: object
      required: [batch_id, job_ids]
      properties:
        batch_id:
          type: string
        job_ids:
          type: array
          items:
            type: string

    BatchSummary:
      type: object
      required: [batch_id, total, status_counts, items, created_at]
      properties:
        batch_id:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        total:
          type: integer
        status_counts:
          type: object
          additionalProperties:
            type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total:
          type: integer

    JobResult:
      type: object
      properties:
        job_id:
          type: string
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        summary:
          type: object
          additionalProperties: true
        raw:
          $ref: '#/components/schemas/JobResultRaw'

    JobResultRaw:
      type: object
      properties:
        locale:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/JobResultEntry'

    JobResultEntry:
      type: object
      properties:
        timestamp:
          type: number
          format: float
        module:
          type: string
        testcase:
          type: string
        tag:
          type: string
        level:
          type: string
        args:
          type: object
          additionalProperties: true
        message:
          type: string
          description: Translated message for the entry (default locale).
        raw:
          type: string
          description: Raw entry string in CLI raw format.

    QueueReorderRequest:
      type: object
      required: [job_ids]
      properties:
        job_ids:
          type: array
          items:
            type: string

    QueueRemoveRequest:
      type: object
      required: [job_ids]
      properties:
        job_ids:
          type: array
          items:
            type: string

    QueueRemoveResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

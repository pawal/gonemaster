        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Public snapshot detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAnalysisSnapshotDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /pub/api/v1/analysis/cohorts/{dataset_tag}/trends:
    get:
      tags: [Public]
      summary: Public cohort snapshot trend
      operationId: publicAnalysisTrends
      parameters:
        - $ref: '#/components/parameters/DatasetTagPath'
        - name: category
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Trend response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAnalysisTrendResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /pub/api/v1/analysis/cohorts/{dataset_tag}/diff:
    get:
      tags: [Public]
      summary: Public cohort snapshot diff
      operationId: publicAnalysisDiff
      parameters:
        - $ref: '#/components/parameters/DatasetTagPath'
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: granularity
          in: query
          required: false
          description: >-
            Diff granularity. Omitted or "domains" returns the per-domain
            diff; "tags" returns which finding tags appeared, cleared, or
            changed worst severity cohort-wide.
          schema:
            type: string
            enum: [domains, tags]
      responses:
        '200':
          description: Diff response (shape depends on granularity)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PublicAnalysisDiffResponse'
                  - $ref: '#/components/schemas/PublicAnalysisTagDiffResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /pub/api/v1/analysis/cohorts/{dataset_tag}/history:
    get:
      tags: [Public]
      summary: Per-entity history across a cohort's captured snapshots
      operationId: publicAnalysisEntityHistory
      parameters:
        - $ref: '#/components/parameters/DatasetTagPath'
        - name: entity
          in: query
          required: true
          schema:
            type: string
            enum: [nameserver, asn, tag, domain]
        - name: key
          in: query
          required: true
          description: Entity identifier (nameserver name, ASN number, tag, or domain).
          schema:
            type: string
      responses:
        '200':
          description: History response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAnalysisEntityHistoryResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Admin token. Required on /api/v1 endpoints when the server is started
        with admin tokens configured (token mode); ignored in open mode. Clients
        send "Authorization: Bearer <token>"; the admin UI uses a session cookie
        set via POST /session.
  parameters:
    IDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PublicIDPath:
      name: public_id
      in: path
      required: true
      schema:
        type: string
    DatasetTagPath:
      name: dataset_tag
      in: path
      required: true
      schema:
        type: string
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
    DomainPath:
      name: domain
      in: path
      required: true
      schema:
        type: string
    NamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
    AddressPath:
      name: address
      in: path
      required: true
      schema:
        type: string
    ASNPath:
      name: asn
      in: path
      required: true
      schema:
        type: integer
    TagPath:
      name: tag
      in: path
      required: true
      schema:
        type: string

  schemas:
    SpecTestcase:
      type: object
      required: [id, module]
      properties:
        id:
          type: string
          example: basic01
        module:
          type: string
          example: basic
        description:
          type: string

    SpecTestcaseList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpecTestcase'
        total:
          type: integer

    SpecTag:
      type: object
      required: [tag]
      properties:
        tag:
          type: string
        message:
          type: string

    SpecTestcaseDetail:
      allOf:
        - $ref: '#/components/schemas/SpecTestcase'
        - type: object
          properties:
            locale:
              type: string
            tags:
              type: array
              items:
                $ref: '#/components/schemas/SpecTag'

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled, expired, paused]

    Job:
      type: object
      required: [id, domain, status, created_at]
      properties:
        id:
          type: string
        batch_id:
          type: string
          description: Optional unique identifier for batch runs.
        domain:
          type: string
        severity_totals:
          type: object
          additionalProperties:
            type: integer
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Progress percentage (0-100).
        priority:
          type: integer
          format: int32
          enum: [0, 1]
          description: "Queue priority: 0=normal (interactive), 1=batch (background). Normal jobs are always dequeued before batch jobs."
        profile_id:
          type: integer
          format: int64
        profile_name:
          type: string
        error:
          type: string

    JobCreateRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        tests:
          type: array
          items:
            type: string
        profile_id:
          type: integer
          format: int64
          description: Optional stored profile reference. If set, the stored profile is loaded before applying any inline overrides.
        profile_overrides:
          type: object
          additionalProperties: true
        nameservers:
          type: array
          description: Optional undelegated nameserver/glue input for single-job pre-delegation testing.
          items:
            $ref: '#/components/schemas/UndelegatedNameserverInput'
        ds_info:
          type: array
          description: Optional undelegated DS input for single-job pre-delegation testing (DS-only mode allowed).
          items:
            $ref: '#/components/schemas/UndelegatedDSInput'
        min_level:
          type: string
        tags:
          type: array
          description: Tag names to apply to the created domain (creates tags/domains if needed).
          items:
            type: string

    JobBatchRequest:
      type: object
      description: >
        Either `domains` or `from_tag` (or both) must be provided.
        Undelegated input (`nameservers`, `ds_info`) is rejected with `400 undelegated_not_supported_for_batch`.
      properties:
        domains:
          type: array
          items:
            type: string
        from_tag:
          type: string
          description: Expand all domains currently in this tag into the batch.
        tests:
          type: array
          items:
            type: string
        profile_id:
          type: integer
          format: int64
          description: Optional stored profile reference applied to every submitted job in the batch.
        profile_overrides:
          type: object
          additionalProperties: true
        min_level:
          type: string
        tags:
          type: array
          description: Tag names to apply to the batch (creates domain/tag records as needed).
          items:
            type: string
        description:
          type: string
          description: Human-readable label stored on the batch record.
        snapshot_intent:
          type: boolean
          description: When true, the batch is intended to become a cohort snapshot.

    UndelegatedNameserverInput:
      type: object
      required: [ns]
      properties:
        ns:
          type: string
          description: Nameserver hostname (normalized/canonicalized server-side).
        ip:
          type: string
          description: Optional IPv4 or IPv6 address for this nameserver row.

    UndelegatedDSInput:
      type: object
      required: [keytag, algorithm, digtype, digest]
      properties:
        keytag:
          type: integer
          minimum: 0
          maximum: 65535
        algorithm:
          type: integer
          minimum: 0
          maximum: 255
        digtype:
          type: integer
          minimum: 0
          maximum: 255
        digest:
          type: string
          description: Hex-encoded DS digest.

    JobBatchResponse:
      type: object
      required: [batch_id, job_ids]
      properties:
        batch_id:
          type: string
        job_ids:
          type: array
          items:
            type: string

    JobPurgeRequest:
      type: object
      properties:
        older_than_days:
          type: integer
          minimum: 0
          description: Days before now. Zero uses the server retention setting.

    JobPurgeResponse:
      type: object
      required: [purged_jobs]
      properties:
        purged_jobs:
          type: integer
          format: int64

    Batch:
      type: object
      required: [id, created_at, domain_count]
      properties:
        id:
          type: string
        tag:
          type: string
        created_at:
          type: string
          format: date-time
        domain_count:
          type: integer
        description:
          type: string
        snapshot_intent:
          type: boolean

    BatchSummary:
      type: object
      required: [batch_id, total, status_counts, items, created_at]
      properties:
        batch_id:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        total:
          type: integer
        status_counts:
          type: object
          additionalProperties:
            type: integer
        grades:
          type: object
          additionalProperties:
            type: integer
          description: Per-grade count of graduated runs in this batch. Absent when no runs have been scored.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'

    BatchList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    BatchDeletePreviewSnapshot:
      type: object
      properties:
        cohort_id:
          type: integer
          format: int64
        cohort_label:
          type: string
        snapshot_slug:
          type: string
        snapshot_label:
          type: string
        is_default:
          type: boolean

    BatchDeletePreview:
      type: object
      required: [batch_id, exists, queued_jobs, running_jobs, completed_runs, entries, fact_rows]
      properties:
        batch_id:
          type: string
        tag:
          type: string
        created_at:
          type: string
          format: date-time
        snapshot_intent:
          type: boolean
        exists:
          type: boolean
        queued_jobs:
          type: integer
        running_jobs:
          type: integer
        completed_runs:
          type: integer
        entries:
          type: integer
        fact_rows:
          type: integer
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/BatchDeletePreviewSnapshot'

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total:
          type: integer

    JobResult:
      type: object
      properties:
        job_id:
          type: string
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        summary:
          type: object
          additionalProperties: true
        score:
          type: object
          description: Full scoring result including numeric score, letter grade, per-category breakdown, and A+ bonus criteria. Absent when no entries are available.
          properties:
            score:
              type: integer
            grade:
              type: string
            categories:
              type: object
              additionalProperties: true
            bonus:
              type: object
              additionalProperties: true
        raw:
          $ref: '#/components/schemas/JobResultRaw'
        has_dnssec_chain:
          type: boolean
          description: >
            True when a stored DNSSEC chain summary exists for this run and can
            be fetched from the dnssec-chain endpoint. Omitted (false) for runs
            without chain data or when the public flag is off.

    DNSSECChain:
      type: object
      description: >
        Per-run DNSSEC authentication-chain summary. The blob is versioned via
        its own `version` field and evolves additively, so this schema is
        intentionally loose. Served verbatim from storage.
      properties:
        version:
          type: integer
          description: >
            Schema version of the chain document. Version 2 added
            `servers_stale` on `parent` and `child` plus NSEC/NSEC3 signatures.
          example: 2
        zone:
          type: string
        parent_zone:
          type: string
        delegation:
          type: string
          enum: [normal, undelegated]
        status:
          type: string
          description: >
            Roll-up verdict. `partial` means the validated path holds but some
            servers serve signatures outside their validity window, or a
            DS-anchored signature cannot be verified locally.
          enum: [secure, broken, partial, island, unsigned, indeterminate]
        truncated:
          type: boolean
        parent:
          type: object
          additionalProperties: true
        child:
          type: object
          additionalProperties: true
        links:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    JobResultRaw:
      type: object
      properties:
        locale:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/JobResultEntry'

    JobResultEntry:
      type: object
      properties:
        timestamp:
          type: number
          format: float
        module:
          type: string
        testcase:
          type: string
        tag:
          type: string
        level:
          type: string
        args:
          type: object
          description: |
            Structured log arguments map.

            Canonical key semantics/types/optionality for coherency-migrated
            entries are defined in `docs/specifications/log-args-coherency.md`.

            Schema `1.x` is additive-only; consumers should ignore unknown keys.
          externalDocs:
            description: Log argument coherency contract (v1.1)
            url: ./specifications/log-args-coherency.md
          example:
            ns: ns1.example
            address: 192.0.2.53
            query_name: example
            query_type: SOA
            query_class: IN
          additionalProperties: true
        message:
          type: string
          description: Translated message for the entry (default locale).
        raw:
          type: string
          description: Raw entry string in CLI raw format.

    QueueReorderRequest:
      type: object
      required: [job_ids]
      properties:
        job_ids:
          type: array
          items:
            type: string

    QueueRemoveRequest:
      type: object
      required: [job_ids]
      properties:
        job_ids:
          type: array
          items:
            type: string

    QueueRemoveResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: array
          items:
            type: string

    Domain:
      type: object
      required: [id, name, created_at, run_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        latest_run_id:
          type: string
        latest_run_at:
          type: string
          format: date-time
        latest_status:
          type: string
        latest_level:
          type: string
        created_at:
          type: string
          format: date-time
        run_count:
          type: integer
        tags:
          type: array
          items:
            type: string

    DomainList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_cursor:
          type: string
        prev_cursor:
          type: string

    Tag:
      type: object
      required: [name, created_at, domain_count]
      properties:
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        domain_count:
          type: integer
        default_profile_id:
          type: integer
          format: int64

    TagCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    TagDomainsRequest:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items:
            type: string

    TagProfileRequest:
      type: object
      required: [profile_id]
      properties:
        profile_id:
          type: integer
          format: int64

    TagSummary:
      type: object
      required: [tag, domain_count, ok, notice, warning, error, critical]
      properties:
        tag:
          type: string
        domain_count:
          type: integer
        ok:
          type: integer
        notice:
          type: integer
        warning:
          type: integer
        error:
          type: integer
        critical:
          type: integer
        grades:
          type: object
          additionalProperties:
            type: integer
          description: Per-grade count of domains (keyed by grade letter, e.g. "A", "B"). Absent when no runs have been scored.

    Run:
      type: object
      required: [id, domain_id, domain, status, created_at, entry_count]
      properties:
        id:
          type: string
        domain_id:
          type: integer
          format: int64
        domain:
          type: string
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
          description: Wall-clock duration of the run in milliseconds.
        sev_notice:
          type: integer
        sev_warning:
          type: integer
        sev_error:
          type: integer
        sev_critical:
          type: integer
        worst_level:
          type: string
        entry_count:
          type: integer
        profile:
          type: string
        public_id:
          type: string
        priority:
          type: integer
          format: int32
          enum: [0, 1]
          description: "Queue priority at the time of submission: 0=normal, 1=batch."
        profile_id:
          type: integer
          format: int64
        profile_name:
          type: string
        effective_profile:
          type: string
          description: JSON snapshot of the fully merged profile used for execution.
        severity_totals:
          type: object
          additionalProperties:
            type: integer
        score:
          type: integer
          description: Numeric quality score in the range [0, 100].
        grade:
          type: string
          description: Letter grade derived from score ("A+", "A", "B", "C", "D", or "F").

    Profile:
      type: object
      required: [id, name, description, config, public, schema_version, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Stored engine profile JSON. A sparse override on top of the engine default profile - only the keys present here are applied; everything else is inherited.
        public:
          type: boolean
        schema_version:
          type: string
          description: Engine version that was current when this profile was last created, updated, or marked reviewed. Used to drive compatibility checks against the running engine version.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileUpsertRequest:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
        description:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Engine profile JSON validated server-side.
        public:
          type: boolean

    PublicProfile:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string

    PublicJob:
      type: object
      required: [public_id, domain, status, progress]
      properties:
        public_id:
          type: string
        domain:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        finished_at:
          type: string
          format: date-time

    PublicInfo:
      type: object
      required: [show_score_public, show_nameserver_timings_public]
      properties:
        show_score_public:
          type: boolean
        show_nameserver_timings_public:
          type: boolean
        show_dnssec_chain_public:
          type: boolean

    FeatureFlags:
      type: object
      required: [show_score_admin, show_nameserver_timings_admin]
      properties:
        show_score_admin:
          type: boolean
        show_nameserver_timings_admin:
          type: boolean

    SettingEntry:
      type: object
      required: [value, source]
      properties:
        value:
          description: Current effective setting value.
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
        source:
          type: string
          enum: [default, config_file, database, cli_flag]
        readonly:
          type: boolean

    DelegationInfo:
      type: object
      required: [nameservers, ds_records]
      properties:
        nameservers:
          type: array
          items:
            type: object
            required: [ns]
            properties:
              ns:
                type: string
              ip:
                type: string
        ds_records:
          type: array
          items:
            type: object
            required: [keytag, algorithm, digtype, digest]
            properties:
              keytag:
                type: integer
              algorithm:
                type: integer
              digtype:
                type: integer
              digest:
                type: string

    AnalysisStatusResponse:
      type: object
      required: [backend_supported, controller_enabled]
      properties:
        backend_supported:
          type: boolean
        controller_enabled:
          type: boolean
        unsupported_message:
          type: string

    AnalysisCohort:
      type: object
      required: [id, source_type, source_tag, label, analysis_enabled, public_enabled, is_default, sort_order, materialization_status, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        source_type:
          type: string
          enum: [tag]
        source_tag:
          type: string
        label:
          type: string
        description:
          type: string
        analysis_enabled:
          type: boolean
        public_enabled:
          type: boolean
        is_default:
          type: boolean
        sort_order:
          type: integer
        materialization_status:
          type: string
          enum: [pending, ready, failed]
        materialization_done:
          type: integer
        materialization_total:
          type: integer
        last_materialized_at:
          type: string
          format: date-time
        last_materialization_error:
          type: string
        default_snapshot_policy:
          type: string
          enum: [auto_latest, pinned]
        default_snapshot_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnalysisCohortUpsertRequest:
      type: object
      required: [source_tag]
      properties:
        source_type:
          type: string
          enum: [tag]
          default: tag
        source_tag:
          type: string
        label:
          type: string
        description:
          type: string
        analysis_enabled:
          type: boolean
        public_enabled:
          type: boolean
        is_default:
          type: boolean
        sort_order:
          type: integer

    AnalysisCohortPatchRequest:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        analysis_enabled:
          type: boolean
        public_enabled:
          type: boolean
        is_default:
          type: boolean
        sort_order:
          type: integer

    AnalysisCohortSnapshot:
      type: object
      required: [id, cohort_id, batch_id, slug, run_count, domain_count, status, is_default, is_public, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        cohort_id:
          type: integer
          format: int64
        batch_id:
          type: string
        slug:
          type: string
        label:
          type: string
        description:
          type: string
        profile_id:
          type: integer
          format: int64
        profile_name:
          type: string
        engine_version:
          type: string
          description: >-
            gonemaster version that produced this snapshot's runs. Absent when
            provenance could not be recovered; never defaults to the running build.
        mixed_engine_version:
          type: boolean
          description: Batch spanned an engine upgrade, so its numbers mix two measurement regimes.
        captured_at:
          type: string
          format: date-time
        first_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
        run_count:
          type: integer
        domain_count:
          type: integer
        status:
          type: string
          enum: [pending, captured, retired, failed_mixed_profiles]
        is_default:
          type: boolean
        is_public:
          type: boolean
        materialization_status:
          type: string
          description: Rematerialize progress state; distinct from the capture-lifecycle status. Empty until first rebuilt.
          enum: ['', pending, ready, failed]
        materialization_done:
          type: integer
          description: Completed rebuild phases (0..materialization_total).
        materialization_total:
          type: integer
          description: Total rebuild phases for the in-flight or last rematerialize.
        last_materialization_error:
          type: string
          description: Error from the last failed rematerialize, if any.
        last_materialized_at:
          type: string
          format: date-time
          description: When the snapshot was last successfully rebuilt.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnalysisCohortSnapshotPatchRequest:
      type: object
      properties:
        slug:
          type: string
        label:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        is_default:
          type: boolean
        status:
          type: string
          enum: [captured, retired]

    PublicAnalysisSnapshotListEntry:
      type: object
      required: [slug, captured_at, run_count, domain_count]
      properties:
        slug:
          type: string
        label:
          type: string
        description:
          type: string
        captured_at:
          type: string
          format: date-time
        first_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
        run_count:
          type: integer
        domain_count:
          type: integer
        profile_name:
          type: string
        engine_version:
          type: string
          description: >-
            gonemaster version that produced this snapshot's runs. Absent when
            provenance could not be recovered; never defaults to the running build.
        mixed_engine_version:
          type: boolean
          description: Batch spanned an engine upgrade, so its numbers mix two measurement regimes.
        is_default:
          type: boolean

    PublicAnalysisSnapshotListResponse:
      type: object
      required: [dataset_tag, label, snapshots]
      properties:
        dataset_tag:
          type: string
        label:
          type: string
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisSnapshotListEntry'

    PublicAnalysisSnapshotDetail:
      allOf:
        - $ref: '#/components/schemas/PublicAnalysisSnapshotListEntry'
        - type: object
          required: [dataset_tag, is_default]
          properties:
            dataset_tag:
              type: string
            aggregates:
              type: object
              additionalProperties: true

    PublicAnalysisTrendResponse:
      type: object
      required: [dataset_tag, category, points]
      properties:
        dataset_tag:
          type: string
        category:
          type: string
        points:
          type: array
          items:
            type: object
            required: [slug, captured_at, payload]
            properties:
              slug:
                type: string
              label:
                type: string
              captured_at:
                type: string
                format: date-time
              first_run_at:
                type: string
                format: date-time
              last_run_at:
                type: string
                format: date-time
              engine_version:
                type: string
              mixed_engine_version:
                type: boolean
              payload:
                type: object
                additionalProperties: true

    PublicAnalysisDiffResponse:
      type: object
      required: [dataset_tag, from_slug, to_slug, added, removed, grade_changed, level_changed]
      properties:
        dataset_tag:
          type: string
        from_slug:
          type: string
        to_slug:
          type: string
        engine:
          $ref: '#/components/schemas/PublicAnalysisEngineDelta'
        added:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisDiffEntry'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisDiffEntry'
        grade_changed:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisDiffEntry'
        level_changed:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisDiffEntry'

    PublicAnalysisEngineDelta:
      type: object
      required: [crossed_engine_versions]
      description: >-
        Engine provenance for the two sides of a diff. crossed_engine_versions
        means they ran different versions, so a finding that appears or clears
        may be new engine capability rather than cohort change.
      properties:
        from_engine_version:
          type: string
        to_engine_version:
          type: string
        crossed_engine_versions:
          type: boolean
        engine_version_unknown:
          type: boolean
          description: One side has no recoverable version, so no comparison can be made.

    PublicAnalysisDiffEntry:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        from_grade:
          type: string
        to_grade:
          type: string
        from_level:
          type: string
        to_level:
          type: string
        worst_level:
          type: string

    PublicAnalysisTagDiffResponse:
      type: object
      required: [dataset_tag, from_slug, to_slug, granularity, appeared, cleared, level_changed]
      properties:
        dataset_tag:
          type: string
        from_slug:
          type: string
        to_slug:
          type: string
        granularity:
          type: string
          enum: [tags]
        engine:
          $ref: '#/components/schemas/PublicAnalysisEngineDelta'
        appeared:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisTagDiffEntry'
        cleared:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisTagDiffEntry'
        level_changed:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisTagDiffEntry'

    PublicAnalysisTagDiffEntry:
      type: object
      required: [tag, from_domain_count, to_domain_count, domain_delta]
      properties:
        tag:
          type: string
        module:
          type: string
        testcase:
          type: string
        from_level:
          type: string
        to_level:
          type: string
        from_domain_count:
          type: integer
        to_domain_count:
          type: integer
        domain_delta:
          type: integer

    PublicAnalysisEntityHistoryResponse:
      type: object
      required: [dataset_tag, entity, key, points]
      properties:
        dataset_tag:
          type: string
        entity:
          type: string
          enum: [nameserver, asn, tag, domain]
        key:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/PublicAnalysisEntityHistoryPoint'

    PublicAnalysisEntityHistoryPoint:
      type: object
      required: [slug, captured_at, present, domain_count]
      properties:
        slug:
          type: string
        captured_at:
          type: string
          format: date-time
        present:
          type: boolean
        domain_count:
          type: integer
        latency_p50_ms:
          type: number
        score:
          type: integer
        grade:
          type: string

    ProfileDefaults:
      type: object
      required: [test_cases, test_levels]
      description: Engine default profile reference data used by the admin UI when checking stored profile compatibility.
      properties:
        test_cases:
          type: array
          description: Sorted list of test case IDs the engine default profile selects.
          items:
            type: string
        test_levels:
          type: object
          description: Per-module map of tag → severity level from the engine default profile.
          additionalProperties:
            type: object
            additionalProperties:
              type: string

    CompatibilityIssue:
      type: object
      required: [type, detail, suggestion]
      properties:
        type:
          type: string
          enum: [missing_test_case, missing_test_levels, invalid_config]
          description: Issue category.
        module:
          type: string
          description: Module name. Set when `type` is `missing_test_levels`.
        detail:
          type: string
          description: Human-readable summary of what is missing.
        suggestion:
          type: string
          description: Suggested remediation, suitable for display to the operator.

    CompatibilityResult:
      type: object
      required: [compatible, reviewed, schema_version, current_version, issues]
      properties:
        compatible:
          type: boolean
          description: True when the profile has no open compatibility issues against the current engine. A reviewed profile stays compatible even when it waives issues.
        reviewed:
          type: boolean
          description: True when `schema_version` equals the current engine version.
        schema_version:
          type: string
          description: The profile's stored `schema_version`.
        current_version:
          type: string
          description: The current engine version.
        issues:
          type: array
          description: Open issues. Always empty for a reviewed profile, except for an unparseable config.
          items:
            $ref: '#/components/schemas/CompatibilityIssue'
        waived_issues:
          type: array
          description: Gaps found despite the review stamp. Present only when `reviewed` is true.
          items:
            $ref: '#/components/schemas/CompatibilityIssue'

    CompatibilitySummary:
      type: object
      required: [id, name, compatible, issue_count, waived_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        compatible:
          type: boolean
        issue_count:
          type: integer
        waived_count:
          type: integer
          description: Number of issues the profile's review is waiving. Zero unless the profile is reviewed.

    ProfileDiffKey:
      type: object
      required: [key, default, value]
      properties:
        key:
          type: string
        default:
          description: The value in the engine default profile.
        value:
          description: The value the profile sets.

    ProfileDiffModule:
      type: object
      required: [module]
      description: Per-key findings for one module of a keyed map property. Modules identical to the default are omitted.
      properties:
        module:
          type: string
        changed:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDiffKey'
        missing:
          type: array
          description: Keys the engine default has and the profile does not restate.
          items:
            type: string
        unknown:
          type: array
          description: Keys the profile sets that the engine default does not have.
          items:
            type: string

    ProfileDiffProperty:
      type: object
      required: [path, kind, redundant]
      properties:
        path:
          type: string
          description: Profile property path, for example `resolver.defaults.timeout`.
        kind:
          type: string
          enum: [changed, redundant, set, map]
          description: |
            `changed` and `redundant` are scalar or opaque properties compared by value;
            `set` is the order-insensitive `test_cases` comparison;
            `map` is a per-key comparison of `test_levels` or `test_cases_vars`.
        redundant:
          type: boolean
          description: True when the property restates the engine default exactly, so removing it leaves the merged profile unchanged.
        wholesale:
          type: boolean
          description: True when overriding the property replaces the whole default table (`test_cases`, `test_levels`), which makes omitted entries dangerous rather than inherited.
        default:
          description: The engine default value. Set for kind `changed`.
        value:
          description: The value the profile sets. Set for kind `changed`.
        excluded:
          type: array
          description: Test cases the engine default runs and the profile does not. Set for kind `set`.
          items:
            type: string
        unknown:
          type: array
          description: Test cases the profile lists that the engine default does not know. Set for kind `set`.
          items:
            type: string
        modules:
          type: array
          description: Per-module findings. Set for kind `map`.
          items:
            $ref: '#/components/schemas/ProfileDiffModule'

    ProfileDiff:
      type: object
      required: [summary, properties]
      properties:
        summary:
          type: object
          required: [deviations, redundant, missing, unknown]
          properties:
            deviations:
              type: integer
              description: Properties that differ from the engine default.
            redundant:
              type: integer
              description: Properties that restate the engine default.
            missing:
              type: integer
              description: Keys the engine default has and an overridden map property does not restate. Excluded test cases are not counted here.
            unknown:
              type: integer
              description: Keys and test cases the profile sets that the engine default does not know.
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDiffProperty'

    ProfilePatchRequest:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum:
            - add_missing_test_cases
            - add_missing_test_levels
            - reset_test_cases
            - reset_test_levels
            - mark_reviewed
            - clear_reviewed
          description: Targeted compatibility operation to apply to the stored profile.
        module:
          type: string
          description: Required when `op` is `reset_test_levels`. Names the `test_levels` module to remove from the override.

    MarkAllReviewedResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: Number of stored profiles whose `schema_version` was bumped to the current engine version.

    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_cursor:
          type: string
        prev_cursor:
          type: string

    Entry:
      type: object
      required: [id, run_id, domain_id, timestamp, module, testcase, tag, level]
      properties:
        id:
          type: integer
          format: int64
        run_id:
          type: string
        domain_id:
          type: integer
          format: int64
        domain:
          type: string
        timestamp:
          type: number
          format: float
        module:
          type: string
        testcase:
          type: string
        tag:
          type: string
        level:
          type: string
        args:
          type: object
          additionalProperties: true

    EntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_cursor:
          type: string
        prev_cursor:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

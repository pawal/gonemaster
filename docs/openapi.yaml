openapi: 3.0.3
info:
  title: Gonemaster API
  version: 0.1.0
  description: |
    REST API for running Gonemaster engine tests with queueing, streaming, and cancellation.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development (API base)

tags:
  - name: Jobs
  - name: Batches
  - name: Domains
  - name: Tags
  - name: Profiles
  - name: Runs
  - name: Entries
  - name: Queue
  - name: Ops
  - name: Analysis
  - name: Public

paths:
  /jobs:
    post:
      tags: [Jobs]
      summary: Submit a single test job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [Jobs]
      summary: List jobs
      operationId: listJobs
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: batch_id
          in: query
          schema:
            type: string
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: domain
          in: query
          schema:
            type: string
        - name: severity
          in: query
          description: Filter by aggregated severity totals before pagination.
          schema:
            type: string
            enum: [warnings_plus, errors_only]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/batch:
    post:
      tags: [Jobs]
      summary: Submit a batch of test jobs
      description: "Submit multiple domains as a single batch. Each job is assigned priority=1 (batch) and will only be dequeued after all priority=0 (normal) jobs have been processed. Undelegated input (`nameservers`, `ds_info`) is not supported for batch submission."
      operationId: createJobBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobBatchRequest'
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobBatchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/purge:
    post:
      tags: [Jobs]
      summary: Purge completed jobs older than a retention window
      operationId: purgeJobs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPurgeRequest'
      responses:
        '200':
          description: Purge count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPurgeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /batches/{batch_id}:
    get:
      tags: [Batches]
      summary: Get batch summary
      operationId: getBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Batches]
      summary: Delete a batch and derived records
      operationId: deleteBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Batch deleted
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /batches/{batch_id}/delete-preview:
    get:
      tags: [Batches]
      summary: Preview batch deletion impact
      operationId: getBatchDeletePreview
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch deletion impact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeletePreview'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Get job status
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/result:
    get:
      tags: [Jobs]
      summary: Get job result
      operationId: getJobResult
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          description: Locale for translated messages (default en)
          schema:
            type: string
      responses:
        '200':
          description: Job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/events:
    get:
      tags: [Jobs]
      summary: Stream job events (SSE)
      operationId: streamJobEvents
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a running or queued job
      operationId: cancelJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /domains:
    get:
      tags: [Domains]
      summary: List domains
      operationId: listDomains
      parameters:
        - name: tag
          in: query
          schema:
            type: string
          description: Filter to domains belonging to this tag.
        - name: name
          in: query
          schema:
            type: string
          description: Substring filter on domain name.
        - name: level
          in: query
          schema:
            type: string
          description: Exact `latest_level` filter (e.g. `ERROR`).
        - name: min_level
          in: query
          schema:
            type: string
          description: Minimum severity threshold; `WARNING` matches WARNING/ERROR/CRITICAL.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Domain list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /domains/{id}:
    get:
      tags: [Domains]
      summary: Get domain by ID
      operationId: getDomain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Domain with tags populated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /domains/{id}/runs:
    get:
      tags: [Domains]
      summary: List run history for a domain
      operationId: listDomainRuns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Run list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /runs:
    get:
      tags: [Runs]
      summary: List runs
      operationId: listRuns
      parameters:
        - name: tag
          in: query
          schema:
            type: string
          description: Filter to runs for domains in this tag.
        - name: domain
          in: query
          schema:
            type: string
          description: Filter by domain name substring.
        - name: batch
          in: query
          schema:
            type: string
          description: Filter by batch ID.
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: level
          in: query
          schema:
            type: string
          description: Filter by `worst_level`.
        - name: grade
          in: query
          schema:
            type: string
            enum: ['A+', 'A', 'B', 'C', 'D', 'F']
          description: Filter by letter grade.
        - name: finished_after
          in: query
          schema:
            type: string
            format: date-time
        - name: finished_before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Run list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /runs/{id}:
    get:
      tags: [Runs]
      summary: Get run by ID
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /runs/{id}/result:
    get:
      tags: [Runs]
      summary: Get run result (same shape as GET /jobs/{id}/result)
      operationId: getRunResult
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          description: Locale for translated messages (default en)
          schema:
            type: string
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tags:
    get:
      tags: [Tags]
      summary: List tags
      operationId: listTags
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Tag array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Tags]
      summary: Create a tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Tag already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tags/{name}:
    put:
      tags: [Tags]
      summary: Update tag description
      operationId: updateTag
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
      responses:
        '200':
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tags]
      summary: Delete a tag
      operationId: deleteTag
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tag deleted
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tags/{name}/domains:
    get:
      tags: [Tags]
      summary: List domains in a tag
      operationId: listTagDomains
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Domain list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Tags]
      summary: Add domains to a tag (creates domain records if needed)
      operationId: addTagDomains
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDomainsRequest'
      responses:
        '204':
          description: Domains added
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tags]
      summary: Remove domains from a tag
      operationId: removeTagDomains
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDomainsRequest'
      responses:
        '204':
          description: Domains removed
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tags/{name}/profile:
    put:
      tags: [Tags]
      summary: Set a tag's default stored profile
      operationId: setTagProfile
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagProfileRequest'
      responses:
        '204':
          description: Tag default profile updated
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tags]
      summary: Clear a tag's default stored profile
      operationId: deleteTagProfile
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tag default profile removed
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tags/{name}/summary:
    get:
      tags: [Tags]
      summary: Get tag severity summary
      operationId: getTagSummary
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-severity domain counts for the tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSummary'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tags/{name}/batches:
    get:
      tags: [Tags]
      summary: List batches for a tag
      operationId: listTagBatches
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /profiles:
    get:
      tags: [Profiles]
      summary: List stored profiles
      operationId: listProfiles
      responses:
        '200':
          description: Stored profile array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
    post:
      tags: [Profiles]
      summary: Create a stored profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpsertRequest'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /profiles/default:
    get:
      tags: [Profiles]
      summary: Get the server default profile
      operationId: getDefaultProfile
      responses:
        '200':
          description: The server base profile after config-file overrides are applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /profiles/defaults:
    get:
      tags: [Profiles]
      summary: Get the engine default test_cases and test_levels
      description: Returns the current engine default profile's `test_cases` and `test_levels`. Used by the admin UI as the canonical reference when checking stored profile compatibility.
      operationId: getProfileDefaults
      responses:
        '200':
          description: Engine default reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDefaults'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /profiles/compatibility:
    get:
      tags: [Profiles]
      summary: Batch compatibility summary for all stored profiles
      description: Returns one entry per stored profile with its compatibility status against the current engine default. Used by the admin UI to drive the "Needs review" badges and the *N profile(s) need review* summary.
      operationId: listProfileCompatibility
      responses:
        '200':
          description: Array of compatibility summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompatibilitySummary'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /profiles/mark-all-reviewed:
    post:
      tags: [Profiles]
      summary: Mark every stored profile as reviewed
      description: Bumps `schema_version` to the current engine version on every stored profile that is not already current. Returns the count of profiles that were updated.
      operationId: markAllProfilesReviewed
      responses:
        '200':
          description: Mark-all result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReviewedResult'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /profiles/{id}/compatibility:
    get:
      tags: [Profiles]
      summary: Detailed compatibility result for one stored profile
      description: Compares the stored profile against the current engine default and returns the list of gaps with suggested remediations. The profile is considered incompatible only when it explicitly overrides a key (`test_cases` or a `test_levels` module) in a way that no longer covers what the current default ships.
      operationId: getProfileCompatibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Compatibility result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResult'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /profiles/{id}:
    get:
      tags: [Profiles]
      summary: Get a stored profile
      operationId: getProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Stored profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Profiles]
      summary: Update a stored profile
      operationId: updateProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpsertRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Profiles]
      summary: Apply a targeted compatibility fix to a stored profile
      description: |
        Applies one of several targeted operations and bumps `schema_version` to
        the current engine version. The supported operations are:

        - `add_missing_test_cases` - append default test cases missing from the profile's `test_cases` array. No-op if the profile does not explicitly set `test_cases`.
        - `add_missing_test_levels` - for each `test_levels` module already overridden by the profile, fill any tags present in the default but missing in the override.
        - `reset_test_cases` - remove the `test_cases` override entirely so the profile inherits all defaults.
        - `reset_test_levels` - remove one module from the `test_levels` override (requires `module`).
        - `mark_reviewed` - leave the config unchanged but bump `schema_version` so the compatibility warning goes away.
      operationId: patchProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Profiles]
      summary: Delete a stored profile
      operationId: deleteProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Profile deleted
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /entries:
    get:
      tags: [Entries]
      summary: Query engine log entries across runs
      operationId: listEntries
      parameters:
        - name: run
          in: query
          schema:
            type: string
          description: Exact run ID.
        - name: domain
          in: query
          schema:
            type: integer
            format: int64
          description: Domain ID (integer).
        - name: tag
          in: query
          schema:
            type: string
          description: Domain tag filter.
        - name: module
          in: query
          schema:
            type: string
          description: Exact module name (e.g. `DNSSEC`).
        - name: testcase
          in: query
          schema:
            type: string
          description: Exact testcase name (e.g. `dnssec01`).
        - name: entry_tag
          in: query
          schema:
            type: string
          description: Log event tag (engine `tag` field, e.g. `DS_ALGO_NOT_SUPPORTED`).
        - name: level
          in: query
          schema:
            type: string
          description: Exact severity level.
        - name: latest
          in: query
          schema:
            type: string
            enum: ['1', 'true']
          description: Restrict to each domain's latest run only.
        - name: batch
          in: query
          schema:
            type: string
          description: Restrict to runs from this batch.
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
          description: >
            `csv` returns a CSV download with columns:
            id, run_id, domain_id, domain, timestamp, module, testcase, tag, level, args.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Entry list (JSON) or CSV download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryList'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /queue/pause:
    post:
      tags: [Queue]
      summary: Pause queue processing
      operationId: pauseQueue
      responses:
        '200':
          description: Queue paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: paused

  /queue/resume:
    post:
      tags: [Queue]
      summary: Resume queue processing
      operationId: resumeQueue
      responses:
        '200':
          description: Queue resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: resumed

  /queue/reorder:
    post:
      tags: [Queue]
      summary: Reorder queued jobs
      description: "Replaces the queued job order. The provided list must contain all currently queued job IDs. Reordering is within-tier only: all normal-priority jobs (priority=0) must appear before all batch-priority jobs (priority=1) in the list. Placing a batch job before a normal job returns 400."
      operationId: reorderQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueReorderRequest'
      responses:
        '200':
          description: Queue reordered
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /queue/remove:
    post:
      tags: [Queue]
      summary: Remove queued jobs
      operationId: removeQueueJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRemoveRequest'
      responses:
        '200':
          description: Jobs removed from queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueRemoveResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /metrics:
    get:
      tags: [Ops]
      summary: Metrics snapshot
      operationId: metrics
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, prom]
            default: json
          description: Response format. `prom` returns Prometheus text exposition; JSON-only query params are ignored.
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [1h, 6h, 24h, 48h]
          description: Optional trend window selection for `trends.windows`.
        - in: query
          name: include
          required: false
          schema:
            type: string
          description: Comma-separated sections to include (`all`, `health`, `jobs`, `api`, `quality`, `insights`, `trends`).
        - in: query
          name: limit_domains
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of domain insight rows in the response.
        - in: query
          name: limit_batches
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of batch insight rows in the response.
      responses:
        '200':
          description: Metrics snapshot or Prometheus text exposition
          content:
            application/json:
              schema:
                type: object
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /locales:

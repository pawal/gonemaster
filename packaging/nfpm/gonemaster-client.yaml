name: gonemaster-client
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Patrik Wallström <pawal@amplitut.de>
description: |
  Command-line client for the gonemaster HTTP server.
  Submits test jobs and retrieves results via the server REST API.
vendor: Patrik Wallström
homepage: https://codeberg.org/pawal/gonemaster
license: BSD-2-Clause

contents:
  - src: dist/linux_${ARCH}/gonemaster-client
    dst: /usr/bin/gonemaster-client
    file_info:
      mode: 0755

  - src: man/man1/gonemaster-client.1.gz
    dst: /usr/share/man/man1/gonemaster-client.1.gz
    file_info:
      mode: 0644

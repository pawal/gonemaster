name: gonemaster-mcp
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Patrik Wallström <pawal@amplitut.de>
description: |
  Model Context Protocol (stdio) bridge for the gonemaster HTTP server.
  Exposes gonemaster-server's admin API as MCP tools for AI agents.
vendor: Patrik Wallström
homepage: https://codeberg.org/pawal/gonemaster
license: BSD-2-Clause

contents:
  - src: dist/linux_${ARCH}/gonemaster-mcp
    dst: /usr/bin/gonemaster-mcp
    file_info:
      mode: 0755

  - src: man/man1/gonemaster-mcp.1.gz
    dst: /usr/share/man/man1/gonemaster-mcp.1.gz
    file_info:
      mode: 0644

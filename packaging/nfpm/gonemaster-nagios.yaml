name: gonemaster-nagios
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Patrik Wallström <pawal@amplitut.de>
description: |
  Nagios/Icinga monitoring plugin for gonemaster.
  Runs a gonemaster test against a domain and exits with a Nagios-style
  status code based on the worst finding severity.
vendor: Patrik Wallström
homepage: https://codeberg.org/pawal/gonemaster
license: BSD-2-Clause

contents:
  - src: dist/linux_${ARCH}/gonemaster-nagios
    dst: /usr/lib/nagios/plugins/check_gonemaster
    file_info:
      mode: 0755

  - src: man/man1/gonemaster-nagios.1.gz
    dst: /usr/share/man/man1/gonemaster-nagios.1.gz
    file_info:
      mode: 0644

name: gonemaster-server-nogui
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Patrik Wallström <pawal@amplitut.de>
description: |
  gonemaster HTTP server without the embedded UI assets.
  Provides the REST API only. Smaller binary footprint for headless or
  API-only deployments. Mutually exclusive with gonemaster-server.
vendor: Patrik Wallström
homepage: https://codeberg.org/pawal/gonemaster
license: BSD-2-Clause

depends:
  - gonemaster-badkeys-data

conflicts:
  - gonemaster-server
replaces:
  - gonemaster-server
provides:
  - gonemaster-server

overrides:
  deb:
    depends:
      - gonemaster-badkeys-data
      - adduser
  rpm:
    depends:
      - gonemaster-badkeys-data
      - shadow-utils
    conflicts:
      - gonemaster-server

contents:
  - src: dist/linux_${ARCH}/gonemaster-server-nogui
    dst: /usr/bin/gonemaster-server
    file_info:
      mode: 0755

  - src: man/man1/gonemaster-server.1.gz
    dst: /usr/share/man/man1/gonemaster-server.1.gz
    file_info:
      mode: 0644

  - src: packaging/systemd/gonemaster-server.service
    dst: /lib/systemd/system/gonemaster-server.service
    file_info:
      mode: 0644

  - src: packaging/env/server.env
    dst: /etc/gonemaster/server.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: gonemaster

  - src: packaging/tmpfiles/gonemaster.conf
    dst: /usr/lib/tmpfiles.d/gonemaster.conf
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/scripts/server-preinstall.sh
  postinstall: packaging/scripts/server-postinstall.sh
  preremove: packaging/scripts/server-preremove.sh
  postremove: packaging/scripts/server-postremove.sh

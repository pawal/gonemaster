name: gonemaster
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Patrik Wallström <pawal@amplitut.de>
description: |
  gonemaster DNS test engine and CLI.
  Runs DNS delegation, zone, and DNSSEC tests against a domain and prints
  a human-readable report.
vendor: Patrik Wallström
homepage: https://codeberg.org/pawal/gonemaster
license: BSD-2-Clause

depends:
  - gonemaster-badkeys-data

contents:
  - src: dist/linux_${ARCH}/gonemaster
    dst: /usr/bin/gonemaster
    file_info:
      mode: 0755

  - src: man/man1/gonemaster.1.gz
    dst: /usr/share/man/man1/gonemaster.1.gz
    file_info:
      mode: 0644

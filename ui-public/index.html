<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Test your DNS zone configuration with Gonemaster - a free online DNS health checker." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gonemaster" />
    <meta property="og:description" content="Test your DNS zone configuration with Gonemaster - a free online DNS health checker." />
    <meta property="og:url" content="__PUBLIC_URL__" />
    <meta property="og:image" content="__PUBLIC_URL__android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gonemaster" />
    <meta name="twitter:description" content="Test your DNS zone configuration with Gonemaster - a free online DNS health checker." />
    <meta name="twitter:image" content="__PUBLIC_URL__android-chrome-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- HREFLANG_TAGS -->
    <!--
      Structured data: one @graph with two @id-linked nodes, a WebSite node and
      the app node. The app node is multi-typed WebApplication +
      SoftwareApplication so parsers that only match SoftwareApplication still
      find it. Every @id and url uses the __PUBLIC_URL__ placeholder, which the
      server substitutes per deployment (server/public/public.go), so nothing
      may be hardcoded to a specific host.

      Deliberately NO `offers` and NO `aggregateRating` on the app node:
      including a price block makes Google's Rich Results treat the markup as a
      software-listing snippet, which then requires ratings and reviews.
      gonemaster collects no user ratings, and fabricating an aggregateRating
      would violate Google's structured-data guidelines. The markup exists for
      entity understanding, not the rich snippet; "free" is conveyed via
      isAccessibleForFree. If you are tempted to add offers, read this again.

      Also deliberately no FAQPage node: Google requires FAQ markup to mirror
      FAQ content visible on the page, and the public UI has none.

      src/test/structured-data.test.js enforces all of this.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "__PUBLIC_URL__#website",
          "name": "Gonemaster",
          "url": "__PUBLIC_URL__",
          "inLanguage": ["cs", "da", "de", "en", "es", "fi", "fr", "ja", "nb", "nl", "sl", "sv"]
        },
        {
          "@type": ["WebApplication", "SoftwareApplication"],
          "@id": "__PUBLIC_URL__#app",
          "name": "Gonemaster",
          "description": "Free online DNS health checker. Runs 80+ automated testcases across nine areas - basics, address records, connectivity, cross-nameserver consistency, delegation, DNSSEC, nameserver behavior, name syntax, and zone data - against every authoritative nameserver for a domain, resolved from the DNS root. Supports undelegated tests with custom NS records and DS trust anchors. Findings are graded by severity, with a 0-100 score, an A+ to F letter grade, and a DNSSEC chain-of-trust view. No account required.",
          "url": "__PUBLIC_URL__",
          "image": "__PUBLIC_URL__android-chrome-512x512.png",
          "isAccessibleForFree": true,
          "applicationCategory": "NetworkUtility",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "isPartOf": { "@id": "__PUBLIC_URL__#website" },
          "sameAs": ["https://codeberg.org/pawal/gonemaster"],
          "featureList": [
            "80+ automated testcases across nine areas: basics, address records, connectivity, consistency, delegation, DNSSEC, nameserver behavior, name syntax, and zone data",
            "Tests every authoritative nameserver for the domain, resolved from the DNS root",
            "Full DNSSEC chain-of-trust validation with an interactive chain graph",
            "Cross-nameserver consistency checks for SOA, NS sets, and addresses",
            "Nameserver reachability over UDP and TCP, with network (ASN) diversity checks",
            "Undelegated (pre-delegation) testing with custom NS records and DS trust anchors",
            "IPv4-only and IPv6-only test modes",
            "Severity-graded findings translated into twelve languages",
            "0-100 score with an A+ to F letter grade",
            "Shareable result links"
          ]
        }
      ]
    }
    </script>
    <title>Gonemaster</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
